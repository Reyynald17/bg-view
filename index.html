<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gambar 16:9</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #wrapper {
    position: relative;
    width: 100vw;
    max-width: 177.78vh;
    aspect-ratio: 16 / 9;
    background: #000;
  }
  #gambar {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .tombolKontrol {
    position: absolute;
    top: 12px;
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 6px;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, transform 0.15s ease;
    backdrop-filter: blur(4px);
    z-index: 10;
  }
  .tombolKontrol:hover {
    background: rgba(0, 0, 0, 0.8);
    transform: scale(1.05);
  }
  .tombolKontrol:active {
    transform: scale(0.95);
  }
  .tombolKontrol svg {
    width: 18px;
    height: 18px;
    fill: #fff;
  }
  #tombolDownload {
    right: 56px;
  }
  #tombolFullscreen {
    right: 12px;
  }
</style>
</head>
<body>
  <div id="wrapper">
    <img id="gambar" src="bg.png" alt="bg">
    <button id="tombolDownload" class="tombolKontrol" aria-label="Download">
      <svg viewBox="0 0 24 24">
        <path d="M5 20h14v-2H5v2zM12 18l5-5h-3V4h-4v9H7l5 5z"/>
      </svg>
    </button>
    <button id="tombolFullscreen" class="tombolKontrol" aria-label="Fullscreen">
      <svg id="ikonMasuk" viewBox="0 0 24 24">
        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
      </svg>
      <svg id="ikonKeluar" viewBox="0 0 24 24" style="display:none;">
        <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
      </svg>
    </button>
  </div>

  <script>
    const wrapper = document.getElementById('wrapper');
    const tombolFullscreen = document.getElementById('tombolFullscreen');
    const tombolDownload = document.getElementById('tombolDownload');
    const gambar = document.getElementById('gambar');
    const ikonMasuk = document.getElementById('ikonMasuk');
    const ikonKeluar = document.getElementById('ikonKeluar');

    tombolFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        if (wrapper.requestFullscreen) {
          wrapper.requestFullscreen();
        } else if (wrapper.webkitRequestFullscreen) {
          wrapper.webkitRequestFullscreen();
        } else if (wrapper.msRequestFullscreen) {
          wrapper.msRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        } else if (document.msExitFullscreen) {
          document.msExitFullscreen();
        }
      }
    });

    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) {
        ikonMasuk.style.display = 'none';
        ikonKeluar.style.display = 'block';
      } else {
        ikonMasuk.style.display = 'block';
        ikonKeluar.style.display = 'none';
      }
    });

    tombolDownload.addEventListener('click', () => {
      const link = document.createElement('a');
      link.href = gambar.src;
      link.download = 'bg.png';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });
  </script>
</body>
</html>
